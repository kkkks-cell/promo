<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>협력사 추가 프로모션 안내</title>
<style>
:root{
  --ink:#171F1E; --ink-2:#495452; --ink-3:#8A9492;
  --paper:#F3F5F4; --card:#FFFFFF; --line:#E3E8E7;
  --mint:#2AC1BC; --mint-wash:#E7F7F6; --teal:#0C5653;
  --shadow:0 8px 24px rgba(23,31,30,.08), 0 1px 3px rgba(23,31,30,.05);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.55; min-height:100vh;
}
.wrap{max-width:680px;margin:0 auto;padding:0 18px 48px}

header{padding:30px 2px 18px}
h1{font-size:clamp(23px,6vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.28}
.dates{margin-top:8px;font-size:13px;color:var(--ink-3);font-weight:600}
.dates b{color:var(--ink-2);font-weight:800;font-variant-numeric:tabular-nums}
.dates .sep{margin:0 7px;color:#C4CDCB}

 
#gate{position:fixed;inset:0;z-index:50;background:#fff;overflow-y:auto}
.gwrap{max-width:460px;margin:0 auto;padding:56px 20px 64px}
.gwrap h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.gsub{margin-top:8px;font-size:14px;color:#666;line-height:1.5}
.gfield{margin-top:28px}
.gfield label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#191919}
.ghint{font-size:11.5px;color:#b0b0b0;font-weight:400;margin-left:6px}
.gfield input{
  width:100%;padding:13px 14px;font-size:16px;letter-spacing:.12em;
  border:1px solid #d9d9d9;border-radius:8px;background:#fff;outline:none;-webkit-appearance:none;
  font-family:inherit;color:#191919;
}
.gfield input:focus{border-color:#191919}
#gbtn{
  width:100%;padding:14px;margin-top:18px;font-size:15px;font-weight:700;
  color:#fff;background:#191919;border:0;border-radius:8px;cursor:pointer;font-family:inherit;
}
#gbtn:disabled{background:#bbb;cursor:default}
#gerr{display:none;margin-top:14px;font-size:13px;color:#d33;line-height:1.5}

 
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
.tcard:first-of-type{margin-top:0}
.thead{
  all:unset;display:flex;width:100%;align-items:center;justify-content:space-between;
  box-sizing:border-box;cursor:pointer;padding:17px 18px;
  background:linear-gradient(135deg,#1C2725 0%,#141D1B 100%);
  position:relative;overflow:hidden;
}
.thead::after{content:"";position:absolute;right:-56px;top:-74px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(42,193,188,.22) 0%,rgba(42,193,188,0) 68%);pointer-events:none}
.thead:focus-visible{outline:2px solid var(--mint);outline-offset:-3px}
.thead .l{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.thead .band{font-size:16.5px;font-weight:800;color:#fff;letter-spacing:-.01em}
.thead .time{font-size:13px;font-weight:600;color:#7FD9D5;font-variant-numeric:tabular-nums}
.thead .chev{color:#B9C7C4}
.chev{width:19px;height:19px;transition:transform .26s ease;flex:none}
.tcard.open>.thead .chev{transform:rotate(180deg)}

.tbody{max-height:0;overflow:hidden;transition:max-height .32s cubic-bezier(.4,0,.2,1)}

 
.rrow{border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rbtn{
  all:unset;display:flex;width:100%;align-items:center;justify-content:space-between;
  box-sizing:border-box;cursor:pointer;padding:13px 18px;
}
.rbtn:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.rbtn .name{font-size:15px;font-weight:700}
.rbtn .r{display:flex;align-items:center;gap:9px}
.rbtn .preview{font-size:15px;font-weight:800;color:var(--teal);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.rbtn .preview small{font-size:.68em;font-weight:700}
.rbtn .chev{color:var(--ink-3);width:17px;height:17px}
.rrow.open{background:#F2F9F8}
.rrow.open .rbtn .name{color:var(--teal)}
.rrow.open .rbtn .chev{transform:rotate(180deg);color:var(--teal)}

.rdetail{max-height:0;overflow:hidden;transition:max-height .28s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(180deg,#E9F4F3 0%,#EDF6F5 100%)}
.rdetail-in{padding:6px 18px 15px;display:flex;flex-direction:column;gap:10px}
.drow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:10px;
  border-top:1px dashed #CFE3E1}
.drow:first-child{border-top:0;padding-top:9px}
.drow .who{flex:1;min-width:0}
.drow .whole{font-size:13.5px;font-weight:700;color:#2A4744}
.members{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;font-weight:600;color:#33504D;background:#fff;border:1px solid #D4E6E4;
  padding:2.5px 8px;border-radius:999px}
.drow .amt{font-size:17px;font-weight:800;color:var(--teal);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.drow .amt small{font-size:.66em;font-weight:700}

@media(prefers-reduced-motion:reduce){.tbody,.rdetail,.chev{transition:none}}

 
footer{margin-top:26px}
.disc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.disc-title{font-size:13.5px;font-weight:800;color:var(--ink-2);letter-spacing:.05em;margin-bottom:10px;
  display:flex;align-items:center;gap:7px}
.disc-title::before{content:"";width:8px;height:8px;background:var(--mint);border-radius:2px}
.disc-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.disc-list li{font-size:12.5px;color:var(--ink-2);padding-left:14px;position:relative}
.disc-list li::before{content:"";position:absolute;left:0;top:.55em;width:5px;height:5px;border-radius:50%;background:#C6D3D1}
.closing{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px}
.closing p{font-size:12.5px;color:var(--ink-2)}
</style>
</head>
<body>

<div id="gate">
  <div class="gwrap">
    <h1>협력사 추가 프로모션 안내</h1>
    <p class="gsub">문자로 받으신 확인코드를 입력해 주세요.</p>
    <form id="gform">
      <div class="gfield">
        <label for="gcode">확인코드 <span class="ghint">문자 메시지에 안내된 코드</span></label>
        <input id="gcode" type="text" inputmode="text" autocomplete="off" autocapitalize="off" maxlength="16" placeholder="코드 입력">
      </div>
      <button id="gbtn" type="submit">확인</button>
      <p id="gerr"></p>
    </form>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>협력사 추가 프로모션 안내</h1>
    <div class="dates">시작일 <b>8월 8일(토)</b><span class="sep">·</span>종료일 <b>8월 8일(토)</b></div>
  </header>

  <div id="tcards"></div>

  <footer>
    <div class="disc-card">
      <div class="disc-title">참고 사항</div>
      <ul class="disc-list" id="discList"></ul>
      <div class="closing" id="closing"></div>
    </div>
  </footer>
</div>

const ORDER = ['seoul','gyeonggi','incheon','busan','daegu','daejeon','sejong','ulsan','gwangju',
               'gangwon','chungbuk','chungnam','jeonbuk','jeonnam','gyeongbuk','gyeongnam','jeju'];
const FULL = {seoul:'서울특별시',gyeonggi:'경기도',incheon:'인천광역시',busan:'부산광역시',daegu:'대구광역시',
  daejeon:'대전광역시',sejong:'세종특별자치시',ulsan:'울산광역시',gwangju:'전남특별자치시-광주',gangwon:'강원도',
  chungbuk:'충청북도',chungnam:'충청남도',jeonbuk:'전라북도',jeonnam:'전남특별자치시-전남',gyeongbuk:'경상북도',
  gyeongnam:'경상남도',jeju:'제주도'};
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

function esc(s){return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function won(n){return n.toLocaleString('ko-KR');}

 
function boot(DATA){
  const byId = Object.fromEntries(DATA.regions.map(r => [r.id, r]));

  document.getElementById('discList').innerHTML =
    DATA.cfg.disclaimers.map(d => `<li>${esc(d)}</li>`).join('');
  document.getElementById('closing').innerHTML =
    (DATA.cfg.closing || []).map(p => `<p>${esc(p)}</p>`).join('');

  function bandAmounts(r, band){
    return r.sections.map(sec => sec.cards.find(c => c.band === band))
      .filter(Boolean).map(c => c.amount);
  }
  function preview(r, band){
    const a = bandAmounts(r, band);
    if (!a.length) return '';
    const mn = Math.min(...a), mx = Math.max(...a);
    return mn === mx ? `+${won(mn)}<small>원</small>`
                     : `+${won(mn)}~${won(mx)}<small>원</small>`;
  }
  function detailRows(r, band){
    const secs = r.sections
      .map(sec => ({sec, card: sec.cards.find(c => c.band === band)}))
      .filter(x => x.card);
    if (!secs.length) return null;
    return secs.map(({sec, card}) => {
      const who = r.uniform
        ? `<span class="whole">${esc(FULL[r.id] || r.name)} 전체</span>`
        : `<div class="members">${sec.members.map(m => `<span class="chip">${esc(m)}</span>`).join('')}</div>`;
      return `<div class="drow"><div class="who">${who}</div>
        <div class="amt">+${won(card.amount)}<small>원</small></div></div>`;
    }).join('');
  }

  document.getElementById('tcards').innerHTML = DATA.bands.map((b, bi) => {
    const rows = ORDER.filter(id => byId[id]).map(id => {
      const detail = detailRows(byId[id], b.band);
      if (!detail) return '';
      return `<div class="rrow">
        <button class="rbtn" type="button" aria-expanded="false">
          <span class="name">${esc(byId[id].name)}</span>
          <span class="r"><span class="preview">${preview(byId[id], b.band)}</span>${CHEV}</span>
        </button>
        <div class="rdetail"><div class="rdetail-in">${detail}</div></div>
      </div>`;
    }).join('');
    return `<div class="tcard">
      <button class="thead" type="button" aria-expanded="false">
        <span class="l"><span class="band">${esc(b.band)}</span><span class="time">${esc(b.time)}</span></span>
        ${CHEV}
      </button>
      <div class="tbody">${rows}</div>
    </div>`;
  }).join('');

  function slide(el, open){
    if (open){
      el.style.maxHeight = el.scrollHeight + 'px';
      const done = e => { if (e.target === el){ el.style.maxHeight = 'none'; el.removeEventListener('transitionend', done); } };
      el.addEventListener('transitionend', done);
    } else {
      el.style.maxHeight = el.scrollHeight + 'px';
      el.offsetHeight;
      el.style.maxHeight = '0px';
    }
  }
  document.querySelectorAll('.tcard').forEach(t => {
    const head = t.querySelector('.thead'), body = t.querySelector('.tbody');
    if (t.classList.contains('open')) body.style.maxHeight = 'none';
    head.addEventListener('click', () => {
      const open = t.classList.toggle('open');
      head.setAttribute('aria-expanded', String(open));
      slide(body, open);
    });
  });
  document.querySelectorAll('.rrow').forEach(rr => {
    const btn = rr.querySelector('.rbtn'), det = rr.querySelector('.rdetail');
    btn.addEventListener('click', () => {
      const open = rr.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
      slide(det, open);
    });
  });
}

 
function tryCode(code){
  const pt = sjcl.decrypt(code, CIPHER);   
  return JSON.parse(pt);
}
const gform = document.getElementById('gform');
const gerr = document.getElementById('gerr');
const gbtn = document.getElementById('gbtn');
gform.addEventListener('submit', e => {
  e.preventDefault();
  const code = document.getElementById('gcode').value.trim();
  gerr.style.display = 'none';
  if (!code){ gerr.textContent = '확인코드를 입력해 주세요.'; gerr.style.display = 'block'; return; }
  gbtn.disabled = true; gbtn.textContent = '확인 중…';
  setTimeout(() => {
    try {
      const data = tryCode(code);
      try { sessionStorage.setItem('promo_gate_code', code); } catch (_) {}
      boot(data);
      document.getElementById('gate').remove();
    } catch (_) {
      gbtn.disabled = false; gbtn.textContent = '확인';
      gerr.textContent = '확인코드가 올바르지 않습니다. 문자 메시지의 코드를 다시 확인해 주세요.';
      gerr.style.display = 'block';
    }
  }, 30);
});
 
try {
  const saved = sessionStorage.getItem('promo_gate_code');
  if (saved){
    const data = tryCode(saved);
    boot(data);
    document.getElementById('gate').remove();
  }
} catch (_) {}
</script>
</body>
